version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:6
    container_name: oj_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - oj_network

  # Redis for Queue and Caching
  redis:
    image: redis:7-alpine
    container_name: oj_redis
    ports:
      - "6379:6379"
    networks:
      - oj_network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/online_judge
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key
      # Add GEMINI, GITHUB, GOOGLE OAuth keys here when deploying
    depends_on:
      - mongo
      - redis
    networks:
      - oj_network

  # Execution Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oj_worker
    command: npm run worker
    environment:
      - MONGO_URI=mongodb://mongo:27017/online_judge
      - REDIS_URL=redis://redis:6379
    volumes:
      # Bind mount docker socket so the worker can spawn sibling containers for code execution
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongo
      - redis
    networks:
      - oj_network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oj_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - oj_network

volumes:
  mongo_data:

networks:
  oj_network:
    driver: bridge
