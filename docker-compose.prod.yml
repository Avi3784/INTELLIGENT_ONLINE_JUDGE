version: '3.8'

services:
  mongo:
    image: mongo:latest
    restart: always
    volumes:
      - mongo_data_prod:/data/db

  redis:
    image: redis:alpine
    restart: always

  backend:
    image: ghcr.io/\${GITHUB_REPOSITORY}/backend:latest
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/oj_prod
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=\${JWT_SECRET}
      - GEMINI_API_KEY=\${GEMINI_API_KEY}
    depends_on:
      - mongo
      - redis

  worker:
    image: ghcr.io/\${GITHUB_REPOSITORY}/backend:latest
    command: npm run worker
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/oj_prod
      - REDIS_URL=redis://redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongo
      - redis

  frontend:
    image: ghcr.io/\${GITHUB_REPOSITORY}/frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data_prod:
